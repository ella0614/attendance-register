<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="w-100" style="max-width:420px;">
        <h1 class="h3 mb-3 fw-normal text-center">Management sign in</h1>
            <form id="loginForm" data-role="management">
    <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password">
        <button type="button" class="btn btn-link px-0" id="togglePassword" onclick="togglePasswordVisibility()">Show Password</button>
    </div>
    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
    <p id="loginMessage" class="signup-message" role="status" aria-live="polite"></p>
</form>
<p class="signup-note"><a href="index.html">Back to home</a></p>
        </div>
      </div>
    <script src="app.js"></script>
</body>
</html>
